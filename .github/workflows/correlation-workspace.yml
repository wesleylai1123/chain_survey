name: Correlation Workspace
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/main.py'
      - 'app/research_workspace.py'
      - 'core/*correlation_engine.py'
      - 'core/research_workspace.py'
      - 'data/research_workspace_snapshot.csv'
      - 'tests/test_research_workspace.py'
      - 'scripts/research_workspace_ui_smoke.py'
      - '.github/workflows/correlation-workspace.yml'

permissions:
  contents: read

jobs:
  research-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk fonts-noto-cjk
      - run: python -m unittest discover -s tests -p 'test_research_workspace.py' -v
      - run: xvfb-run -a --server-args='-screen 0 1440x900x24' python scripts/research_workspace_ui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: correlation-workspace
          path: artifacts/research-workspace-*.png
          if-no-files-found: error
