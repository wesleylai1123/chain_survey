name: ABF Research Model

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore ABF industry history
        run: |
          git fetch origin evidence-data
          git checkout origin/evidence-data -- data/history
          test -s data/history/free_industry_history_panel.csv

      - name: Build targeted ABF financial history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/refresh_factor_validation.py             --stocks 3037,3189,8046             --start 2020-01-01             --sleep-seconds 0.1             --cache-dir artifacts/abf_factor_cache             --manifest artifacts/abf_factor_cache_manifest.json             --output artifacts/factor_validation_dataset.csv             --raw-dir artifacts/abf_factor_raw             2>&1 | tee abf-factor-refresh-results.txt
          test -s artifacts/factor_validation_dataset.csv

      - name: Run ABF timing and sensitivity tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_indicator_taxonomy.py' -v | tee indicator-taxonomy-test-results.txt
          python -m unittest discover -s tests -p 'test_directional_indicator_engine.py' -v | tee directional-indicator-test-results.txt
          python -m unittest discover -s tests -p 'test_scenario_evidence_validation.py' -v | tee scenario-evidence-validation-test-results.txt
          python -m unittest discover -s tests -p 'test_abf_sensitivity_engine.py' -v | tee abf-sensitivity-test-results.txt
          python -m unittest discover -s tests -p 'test_abf_data_coverage.py' -v | tee abf-data-coverage-test-results.txt
          python -m unittest discover -s tests -p 'test_filing_availability.py' -v | tee filing-availability-test-results.txt
          python -m unittest discover -s tests -p 'test_abf_margin_transmission.py' -v | tee abf-margin-transmission-test-results.txt

      - name: Build real ABF research snapshot
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_abf_research_model.py 2>&1 | tee abf-research-results.txt

      - name: Validate ABF research outputs
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          timing=pd.read_csv('artifacts/abf_indicator_timing.csv')
          sens=pd.read_csv('artifacts/abf_revenue_sensitivity.csv')
          scenarios=pd.read_csv('artifacts/abf_scenario_validation.csv')
          coverage=pd.read_csv('artifacts/abf_data_coverage.csv')
          margin=pd.read_csv('artifacts/abf_revenue_to_margin_scan.csv')
          snap=json.load(open('artifacts/abf_research_snapshot.json',encoding='utf-8'))

          assert {'LEADING','COINCIDENT','LAGGING'} <= set(timing['timing_class'])
          lead=timing[timing.indicator_id=='tpca_pcb_revenue_yoy'].iloc[0]
          assert lead['timing_class']=='LEADING'
          assert int(lead['lag_value'])==1
          assert lead['evidence_status']=='FULL_SAMPLE_RELATION_VALIDATED'

          assert set(sens['ticker'])=={'3037.TW','3189.TW','8046.TW','ABF'}
          assert set(scenarios['scenario'])=={'UPSIDE','DOWNSIDE'}
          assert scenarios['source_name'].notna().all()
          assert scenarios['sample_size'].ge(0).all()
          # Each source owns its own status; never infer downside from upside.
          assert set(scenarios['status']) <= {'VALIDATED','CANDIDATE','INSUFFICIENT'}
          assert scenarios['source_urls'].notna().all()
          assert scenarios['knowledge_time_methods'].notna().all()
          assert scenarios['cross_company_positive_share'].between(0,1).all()
          assert sens['sample_size'].min() >= 24
          assert {'AVAILABLE','PROXY','MISSING','INSUFFICIENT_HISTORY','NOT_CONNECTED'} >= set(coverage['status'])
          assert (coverage['data_id']=='abf_asp_history').any()
          assert coverage.loc[coverage.data_id=='abf_asp_history','status'].iloc[0]=='MISSING'
          assert coverage.loc[coverage.data_id=='quarterly_exact_filing_time','status'].iloc[0]=='AVAILABLE'
          assert coverage.loc[coverage.data_id=='ic_substrate_revenue_mix_history','status'].iloc[0]=='INSUFFICIENT_HISTORY'
          assert coverage.loc[coverage.data_id=='abf_product_mix_history','status'].iloc[0]=='MISSING'
          assert not margin.empty
          assert set(margin['lag_quarters']) <= {0,1,2}
          assert (sens['beta'] > 0).all()
          assert (sens['beta_ci_low'] > 0).all()
          assert snap['downstream']['revenue'] in {
              'DIRECTION_VALIDATED_MAGNITUDE_CANDIDATE',
              'DIRECTION_AND_MAGNITUDE_VALIDATED'
          }
          basket=sens[sens.ticker=='ABF'].iloc[0]
          expected=(
              'DIRECTION_AND_MAGNITUDE_VALIDATED'
              if bool(basket['magnitude_validation_pass'])
              else 'DIRECTION_VALIDATED_MAGNITUDE_CANDIDATE'
          )
          assert snap['downstream']['revenue']==expected
          assert snap['downstream']['gross_margin']=='NOT_YET_CALIBRATED'

          print('ABF_RESEARCH_OUTPUTS_OK')
          assert set(sens['direction_status'])=={'VALIDATED'}
          print(sens[['company','beta','beta_ci_low','beta_ci_high','r2','oos_r2','oos_directional_corr','sensitivity_status','impact_per_10ppt_driver']].to_string(index=False))
          PY

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk

      - name: Render ABF Research Lab
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1600x1000x24" python scripts/abf_research_ui_smoke.py | tee abf-research-ui-smoke-results.txt
          grep -q "ABF_RESEARCH_UI_SMOKE_OK" abf-research-ui-smoke-results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abf-research-preview
          path: |
            artifacts/abf_indicator_timing.csv
            artifacts/abf_revenue_sensitivity.csv
            artifacts/abf_research_snapshot.json
            artifacts/abf_data_coverage.csv
            artifacts/abf_revenue_to_margin_scan.csv
            artifacts/abf_scenario_validation.csv
            artifacts/abf_scenario_validation_details.json
            artifacts/abf-indicator-timing.png
            artifacts/abf-scenario-evidence.png
            artifacts/abf-data-coverage.png
            artifacts/abf-revenue-to-gm.png
            artifacts/abf-revenue-sensitivity.png
            artifacts/abf-driver-sensitivity-model.png
            indicator-taxonomy-test-results.txt
            directional-indicator-test-results.txt
            scenario-evidence-validation-test-results.txt
            abf-sensitivity-test-results.txt
            abf-data-coverage-test-results.txt
            filing-availability-test-results.txt
            abf-margin-transmission-test-results.txt
            abf-factor-refresh-results.txt
            abf-research-results.txt
            abf-research-ui-smoke-results.txt
          if-no-files-found: error
