name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: ignore

  universe-data:
    name: Build Taiwan stock universe
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build live Taiwan universe and research sample
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          TOKEN_ARGS=()
          if [ -n "${FINMIND_TOKEN}" ]; then TOKEN_ARGS=(--token "${FINMIND_TOKEN}"); fi
          python scripts/build_taiwan_universe.py --sample-industries 5 --sample-per-industry 2 "${TOKEN_ARGS[@]}" 2>&1 | tee universe-results.txt
      - name: Validate universe
        run: |
          python - <<'PY'
          import pandas as pd
          u=pd.read_csv('artifacts/taiwan_stock_universe.csv')
          s=pd.read_csv('artifacts/taiwan_research_sample.csv')
          assert len(u) >= 500
          assert u['market'].nunique() >= 2
          assert s['industry'].nunique() >= 4
          assert len(s) >= 8
          print('TAIWAN_UNIVERSE_VALID', len(u), u['industry'].nunique(), len(s), s['industry'].nunique())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: taiwan-stock-universe
          path: |
            artifacts/taiwan_stock_universe.csv
            artifacts/taiwan_research_sample.csv
            universe-results.txt
          if-no-files-found: error

  factor-data:
    name: Build cached real factor dataset
    runs-on: ubuntu-latest
    needs: [test, universe-data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taiwan-stock-universe
          path: downloaded-universe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Restore persistent factor cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/factor_cache
            artifacts/factor_cache_manifest.json
          key: factor-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            factor-cache-${{ github.ref_name }}-
            factor-cache-main-
      - name: Build historical multi-industry factor validation dataset
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          TOKEN_ARGS=()
          if [ -n "${FINMIND_TOKEN}" ]; then TOKEN_ARGS=(--token "${FINMIND_TOKEN}"); fi
          python scripts/refresh_factor_validation.py --start 2020-01-01 --stocks "" --universe-file downloaded-universe/artifacts/taiwan_research_sample.csv "${TOKEN_ARGS[@]}" 2>&1 | tee factor-dataset-results.txt
      - name: Verify cache-hit second pass
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          TOKEN_ARGS=()
          if [ -n "${FINMIND_TOKEN}" ]; then TOKEN_ARGS=(--token "${FINMIND_TOKEN}"); fi
          python scripts/refresh_factor_validation.py --start 2020-01-01 --stocks "" --universe-file downloaded-universe/artifacts/taiwan_research_sample.csv --sleep-seconds 0 "${TOKEN_ARGS[@]}" 2>&1 | tee cache-hit-results.txt
          grep -q "CACHE_HIT" cache-hit-results.txt
      - name: Smoke resumable full-universe batch runner
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          TOKEN_ARGS=()
          if [ -n "${FINMIND_TOKEN}" ]; then TOKEN_ARGS=(--token "${FINMIND_TOKEN}"); fi
          python scripts/run_full_universe_batches.py \
            --universe-file downloaded-universe/artifacts/taiwan_research_sample.csv \
            --start 2020-01-01 --batch-size 4 --max-batches 1 --sleep-seconds 0 \
            "${TOKEN_ARGS[@]}" 2>&1 | tee full-universe-runner-results.txt
          grep -q "FULL_UNIVERSE_RUN_OK" full-universe-runner-results.txt
      - name: Validate dataset and cache manifest
        run: |
          python - <<'PY'
          import json, pandas as pd
          df=pd.read_csv('artifacts/factor_validation_dataset.csv')
          assert len(df) >= 80
          assert df['ticker'].nunique() >= 8
          assert df['industry'].nunique() >= 4
          assert df['future_3m_return'].notna().sum() >= 40
          m=json.load(open('artifacts/factor_cache_manifest.json', encoding='utf-8'))
          entries=list(m['entries'].values())
          assert len(entries) >= 48
          assert all(e['status']=='success' for e in entries), [e for e in entries if e['status']!='success']
          full=pd.read_csv('artifacts/factor_validation_full.csv')
          assert full['stock_id'].nunique() >= 4
          print('FACTOR_CACHE_VALID', len(entries), 'DATASET', len(df), df['ticker'].nunique(), 'BATCH_ROWS', len(full))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: factor-validation-dataset
          path: |
            artifacts/factor_validation_dataset.csv
            artifacts/factor_validation_full.csv
            artifacts/factor_validation_raw/*.csv
            artifacts/factor_cache_manifest.json
            factor-dataset-results.txt
            cache-hit-results.txt
            full-universe-runner-results.txt
          if-no-files-found: error

  ui-smoke:
    name: Render UI preview
    runs-on: ubuntu-latest
    needs: [test, factor-data, universe-data]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: factor-validation-dataset
          path: downloaded-factor-data
      - uses: actions/download-artifact@v4
        with:
          name: taiwan-stock-universe
          path: downloaded-universe
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp downloaded-factor-data/artifacts/factor_validation_dataset.csv artifacts/factor_validation_dataset.csv
          cp downloaded-factor-data/artifacts/factor_cache_manifest.json artifacts/factor_cache_manifest.json
          cp downloaded-universe/artifacts/taiwan_stock_universe.csv artifacts/taiwan_stock_universe.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk
      - name: Render all UIs
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/ui_smoke.py | tee ui-smoke-results.txt
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/correlation_ui_smoke.py | tee correlation-ui-smoke-results.txt
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/panel_correlation_ui_smoke.py | tee panel-correlation-ui-smoke-results.txt
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/factor_validation_ui_smoke.py | tee factor-validation-ui-smoke-results.txt
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/factor_robustness_ui_smoke.py | tee factor-robustness-ui-smoke-results.txt
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/full_universe_ui_smoke.py | tee full-universe-ui-smoke-results.txt
      - name: Validate UI smoke markers
        run: |
          grep -q "UI_SMOKE_OK" ui-smoke-results.txt
          grep -q "CORRELATION_UI_SMOKE_OK" correlation-ui-smoke-results.txt
          grep -q "PANEL_CORRELATION_UI_SMOKE_OK" panel-correlation-ui-smoke-results.txt
          grep -q "FACTOR_VALIDATION_UI_SMOKE_OK" factor-validation-ui-smoke-results.txt
          grep -q "FACTOR_ROBUSTNESS_UI_SMOKE_OK" factor-robustness-ui-smoke-results.txt
          grep -q "FULL_UNIVERSE_UI_SMOKE_OK" full-universe-ui-smoke-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: |
            artifacts/product-eps-dashboard.png
            artifacts/correlation-lab.png
            artifacts/panel-correlation-lab.png
            artifacts/factor-validation-lab.png
            artifacts/factor-robustness-lab.png
            artifacts/full-universe-runner.png
            *ui-smoke-results.txt
          if-no-files-found: warn
