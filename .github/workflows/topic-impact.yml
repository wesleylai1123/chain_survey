name: Topic Impact UI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'tests/test_topic_impact*.py'
      - 'scripts/topic_impact_ui_smoke.py'
      - '.github/workflows/topic-impact.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  topic-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tk fonts-noto-cjk
      - run: xvfb-run -a python -m unittest discover -s tests -p 'test_topic_impact*.py' -v
      - run: xvfb-run -a --server-args='-screen 0 1440x900x24' python scripts/topic_impact_ui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: topic-impact-ui
          path: artifacts/topic-impact-*.png
          if-no-files-found: error
