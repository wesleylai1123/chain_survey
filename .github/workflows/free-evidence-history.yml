name: Free Evidence History

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.run_id) || 'evidence-data-writer' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      RESEARCH_PIPELINE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 0

      - name: Checkout persistent evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence-data
          path: evidence-data
          fetch-depth: 1

      - name: Restore persisted history and continuity baseline
        shell: bash
        run: |
          mkdir -p code/data/history code/artifacts code/baseline/history
          if [ -d evidence-data/data/history ]; then
            cp -a evidence-data/data/history/. code/data/history/
          fi
          if [ -d evidence-data/persistent/baselines/history ]; then
            cp -a evidence-data/persistent/baselines/history/. code/baseline/history/
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run history parser tests
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_mops_history_parser.py' -v | tee mops-history-test-results.txt
          python -m unittest discover -s tests -p 'test_tpca_history_parser.py' -v | tee tpca-history-test-results.txt
          python -m unittest discover -s tests -p 'test_trendforce_public_history.py' -v | tee trendforce-history-test-results.txt
          python -m unittest discover -s tests -p 'test_free_evidence_history_panel.py' -v | tee history-panel-test-results.txt

      - name: Backfill MOPS-derived ABF monthly history
        working-directory: code
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python scripts/backfill_mops_abf_history.py --from-month 2024-01 --to-month "$(date -d '1 month ago' +%Y-%m)" --transport finmind --delay 0

      - name: Backfill TPCA public industry history
        working-directory: code
        run: |
          python scripts/backfill_tpca_history.py --min-year 2024 --max-pages 40 --workers 4 --delay 0

      - name: Append TrendForce public price snapshot
        working-directory: code
        run: |
          python scripts/collect_trendforce_public_history.py

      - name: Build correlation-ready history panel
        working-directory: code
        run: |
          python scripts/build_free_evidence_history_panel.py
          python scripts/render_free_evidence_history_coverage.py

      - name: Validate historical evidence pipeline
        working-directory: code
        run: |
          python scripts/validate_research_pipeline.py --pipeline history --output artifacts/history_pipeline_validation.json

      - name: Validate history continuity against last-known-good baseline
        working-directory: code
        run: |
          python scripts/validate_pipeline_continuity.py             --pipeline history             --baseline-dir baseline/history             --output artifacts/history_pipeline_continuity.json

      - name: Build historical pipeline run manifest
        working-directory: code
        run: |
          python scripts/build_pipeline_run_manifest.py \
            --run-id "$RESEARCH_PIPELINE_RUN_ID" \
            --pipeline free_evidence_history \
            --output data/history/mops_abf_monthly_revenue_history.csv \
            --output data/history/tpca_industry_history.csv \
            --output data/history/trendforce_public_price_history.csv \
            --output data/history/free_industry_history_panel.csv \
            --output data/history/free_industry_history_coverage.csv \
            --output artifacts/history_pipeline_validation.json \
            --validation-json artifacts/history_pipeline_validation.json \
            --output-manifest artifacts/history_pipeline_run_manifest.json

      - name: Upload free evidence history artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-evidence-history
          path: |
            code/data/history/mops_abf_monthly_revenue_history.csv
            code/data/history/tpca_industry_history.csv
            code/data/history/trendforce_public_price_history.csv
            code/data/history/free_industry_history_panel.csv
            code/data/history/free_industry_history_coverage.csv
            code/artifacts/free-industry-history-coverage.png
            code/artifacts/history_pipeline_validation.json
            code/artifacts/history_pipeline_continuity.json
            code/artifacts/history_pipeline_run_manifest.json
            code/*history-test-results.txt
          if-no-files-found: error

      - name: Persist validated history and audit manifests to evidence-data
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf evidence-data/data/history
          mkdir -p evidence-data/data/history evidence-data/persistent/run_manifests/history evidence-data/persistent/baselines/history
          cp -a code/data/history/. evidence-data/data/history/
          cp code/artifacts/history_pipeline_run_manifest.json "evidence-data/persistent/run_manifests/history/$RESEARCH_PIPELINE_RUN_ID.json"
          cp code/artifacts/history_pipeline_validation.json "evidence-data/persistent/run_manifests/history/$RESEARCH_PIPELINE_RUN_ID.validation.json"
          cp code/artifacts/history_pipeline_continuity.json "evidence-data/persistent/run_manifests/history/$RESEARCH_PIPELINE_RUN_ID.continuity.json"
          cp code/data/history/free_industry_history_panel.csv evidence-data/persistent/baselines/history/free_industry_history_panel.csv
          cd evidence-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history persistent/run_manifests/history persistent/baselines/history
          if git diff --cached --quiet; then
            echo "No history changes to persist"
          else
            git commit -m "data: refresh validated free industry evidence history"
            git push origin evidence-data
          fi
