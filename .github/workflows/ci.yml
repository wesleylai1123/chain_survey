name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Write test summary
        if: always()
        shell: bash
        run: |
          echo "## Python test summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 test-results.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt
          if-no-files-found: ignore

  factor-data:
    name: Build real factor dataset
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build historical factor validation dataset
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          TOKEN_ARGS=()
          if [ -n "${FINMIND_TOKEN}" ]; then TOKEN_ARGS=(--token "${FINMIND_TOKEN}"); fi
          python scripts/refresh_factor_validation.py --start 2020-01-01 "${TOKEN_ARGS[@]}" 2>&1 | tee factor-dataset-results.txt

      - name: Validate dataset artifact
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          p='artifacts/factor_validation_dataset.csv'
          df=pd.read_csv(p)
          assert len(df) >= 50, f'too few rows: {len(df)}'
          assert df['ticker'].nunique() >= 4, f'too few companies: {df["ticker"].nunique()}'
          assert df['future_3m_return'].notna().sum() >= 20, 'insufficient future-return targets'
          print('FACTOR_DATASET_VALID', len(df), df['ticker'].nunique(), df['future_3m_return'].notna().sum())
          PY

      - name: Upload factor dataset
        uses: actions/upload-artifact@v4
        with:
          name: factor-validation-dataset
          path: |
            artifacts/factor_validation_dataset.csv
            artifacts/factor_validation_raw/*.csv
            factor-dataset-results.txt
          if-no-files-found: error

  ui-smoke:
    name: Render UI preview
    runs-on: ubuntu-latest
    needs: [test, factor-data]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download factor dataset
        uses: actions/download-artifact@v4
        with:
          name: factor-validation-dataset
          path: downloaded-factor-data

      - name: Prepare dataset path
        shell: bash
        run: |
          mkdir -p artifacts
          cp downloaded-factor-data/artifacts/factor_validation_dataset.csv artifacts/factor_validation_dataset.csv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk

      - name: Render dashboard and capture screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/ui_smoke.py 2>&1 | tee ui-smoke-results.txt

      - name: Render correlation lab and capture screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/correlation_ui_smoke.py 2>&1 | tee correlation-ui-smoke-results.txt

      - name: Render panel correlation lab and capture screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/panel_correlation_ui_smoke.py 2>&1 | tee panel-correlation-ui-smoke-results.txt

      - name: Render factor validation lab and capture screenshot
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1500x1000x24" python scripts/factor_validation_ui_smoke.py 2>&1 | tee factor-validation-ui-smoke-results.txt

      - name: Write UI summary
        if: always()
        shell: bash
        run: |
          echo "## UI smoke summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep -q "UI_SMOKE_OK" ui-smoke-results.txt 2>/dev/null && echo "✅ Product EPS Dashboard rendered successfully." >> "$GITHUB_STEP_SUMMARY" || echo "❌ Product EPS Dashboard smoke check failed." >> "$GITHUB_STEP_SUMMARY"
          grep -q "CORRELATION_UI_SMOKE_OK" correlation-ui-smoke-results.txt 2>/dev/null && echo "✅ Correlation Lab rendered successfully." >> "$GITHUB_STEP_SUMMARY" || echo "❌ Correlation Lab smoke check failed." >> "$GITHUB_STEP_SUMMARY"
          grep -q "PANEL_CORRELATION_UI_SMOKE_OK" panel-correlation-ui-smoke-results.txt 2>/dev/null && echo "✅ Cross-company / cycle validation rendered successfully." >> "$GITHUB_STEP_SUMMARY" || echo "❌ Panel correlation smoke check failed." >> "$GITHUB_STEP_SUMMARY"
          grep -q "FACTOR_VALIDATION_UI_SMOKE_OK" factor-validation-ui-smoke-results.txt 2>/dev/null && echo "✅ Real Factor Validation Dataset UI rendered successfully." >> "$GITHUB_STEP_SUMMARY" || echo "❌ Factor Validation Dataset UI smoke check failed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: |
            artifacts/product-eps-dashboard.png
            artifacts/correlation-lab.png
            artifacts/panel-correlation-lab.png
            artifacts/factor-validation-lab.png
            ui-smoke-results.txt
            correlation-ui-smoke-results.txt
            panel-correlation-ui-smoke-results.txt
            factor-validation-ui-smoke-results.txt
          if-no-files-found: warn
