name: Turnaround Radar UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout persistent factor data
        uses: actions/checkout@v4
        with:
          ref: factor-data
          path: factor-data
          fetch-depth: 1

      - name: Prepare factor dataset
        shell: bash
        run: |
          mkdir -p code/artifacts
          cp factor-data/persistent/factor_validation/factor_validation_full.csv code/artifacts/factor_validation_dataset.csv
          test -s code/artifacts/factor_validation_dataset.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run turnaround unit tests
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_turnaround_engine -v 2>&1 | tee turnaround-test-results.txt

      - name: Validate persistent radar output
        working-directory: code
        shell: bash
        run: |
          python - <<'PY'
          import pandas as pd
          from core.turnaround_engine import build_turnaround_radar, validate_turnaround_signal
          df = pd.read_csv('artifacts/factor_validation_dataset.csv')
          radar = build_turnaround_radar(df)
          assert len(radar) >= 20, len(radar)
          assert radar['turnaround_score'].notna().all()
          assert radar['confidence'].between(0, 100).all()
          validation = validate_turnaround_signal(df, target='future_6m_return')
          assert validation['samples'] >= 100, validation
          print('TURNAROUND_RADAR_DATA_OK', len(radar), validation)
          radar.to_csv('artifacts/turnaround_radar_latest.csv', index=False)
          PY

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk

      - name: Render Turnaround Radar
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1600x1000x24" python scripts/turnaround_ui_smoke.py | tee turnaround-ui-smoke-results.txt
          grep -q "TURNAROUND_UI_SMOKE_OK" turnaround-ui-smoke-results.txt

      - name: Upload radar preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnaround-radar-preview
          path: |
            code/artifacts/turnaround-radar.png
            code/artifacts/turnaround_radar_latest.csv
            code/turnaround-ui-smoke-results.txt
            code/turnaround-test-results.txt
          if-no-files-found: error
