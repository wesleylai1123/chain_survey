name: Free Evidence Connectors

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout persistent evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence-data
          path: evidence-data
          fetch-depth: 1

      - name: Restore persistent evidence snapshots
        shell: bash
        run: |
          mkdir -p code/persistent/free_evidence
          if [ -d evidence-data/persistent/free_evidence ]; then
            cp -a evidence-data/persistent/free_evidence/. code/persistent/free_evidence/
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run connector tests
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_free_evidence_connectors.py' -v 2>&1 | tee free-evidence-connector-tests.txt
          python -m unittest discover -s tests -p 'test_free_evidence_pipeline.py' -v 2>&1 | tee free-evidence-pipeline-tests.txt

      - name: Collect live free evidence
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          python scripts/collect_free_evidence.py | tee free-evidence-collection.txt

      - name: Validate live collection
        working-directory: code
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          status=json.load(open('artifacts/free_evidence_collection_status.json',encoding='utf-8'))
          evidence=pd.read_csv('artifacts/free_evidence_latest.csv')
          assert status['sources_ok'] >= 2, status
          assert len(evidence) >= 1, status
          assert set(evidence['availability_policy']) == {'collection_time_conservative'}
          assert set(evidence['provenance']) == {'LIVE_FREE_POINT_IN_TIME'}
          print('FREE_EVIDENCE_LIVE_OK', status['sources_ok'], len(evidence))
          PY

      - name: Install virtual display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot tk

      - name: Render free evidence dashboard
        working-directory: code
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1600x1000x24" python scripts/free_evidence_ui_smoke.py | tee free-evidence-ui-smoke-results.txt
          grep -q "FREE_EVIDENCE_UI_SMOKE_OK" free-evidence-ui-smoke-results.txt

      - name: Upload connector preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-evidence-preview
          path: |
            code/artifacts/free-evidence-dashboard.png
            code/artifacts/free_evidence_latest.csv
            code/artifacts/free_evidence_collection_status.json
            code/free-evidence-connector-tests.txt
            code/free-evidence-pipeline-tests.txt
            code/free-evidence-collection.txt
            code/free-evidence-ui-smoke-results.txt
          if-no-files-found: error

      - name: Persist changed snapshots
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf evidence-data/persistent/free_evidence
          mkdir -p evidence-data/persistent
          cp -a code/persistent/free_evidence evidence-data/persistent/free_evidence
          cd evidence-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add persistent/free_evidence
          if git diff --cached --quiet; then
            echo "No new evidence snapshot"
          else
            git commit -m "data: update free point-in-time evidence snapshots"
            git push origin evidence-data
          fi
